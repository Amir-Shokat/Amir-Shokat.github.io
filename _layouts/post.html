---
layout: default
---
<article class="post">
  <p class="kicker"><a href="{{ '/interests/' | relative_url }}">← Interests &amp; posts</a></p>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  {% if page.image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">{% endif %}
  <div class="post-body">
    {{ content }}
  </div>
</article>
