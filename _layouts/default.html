<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
  <meta property="og:image" content="{{ site.url }}/assets/img/amir.jpg">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)">
  <script>
    // apply a saved light/dark choice before the page paints
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3a66'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='32' fill='%23fbfaf7' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% assign path = page.url %}
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="{{ '/' | relative_url }}">Amirmahdi Shokatabadi</a>
      <nav class="nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}" {% if path == '/' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/cv/' | relative_url }}" {% if path == '/cv/' %}aria-current="page"{% endif %}>CV</a>
        <a href="{{ '/projects/' | relative_url }}" {% if path == '/projects/' or page.collection == 'projects' %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/research/' | relative_url }}" {% if path == '/research/' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/interests/' | relative_url }}" {% if path == '/interests/' or page.layout == 'post' %}aria-current="page"{% endif %}>Interests</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container foot">
      <p>© {{ site.time | date: "%Y" }} {{ site.author }}</p>
      <nav aria-label="Elsewhere">
        <a href="mailto:{{ site.email }}">Email</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin }}/" rel="noopener">LinkedIn</a>
        <a href="https://github.com/{{ site.github }}" rel="noopener">GitHub</a>
      </nav>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
